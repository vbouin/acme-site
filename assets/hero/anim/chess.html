const CONFIG = {
  duration: 4000,           // total animation in ms
  holdAtEnd: 600,           // pause on final frame before loop restart
  hold: 280,                // impact pause (scaled from preset 100ms × 4000/1400)
  squash: 0.30,
  antic: 0.20,
  spin: 1.5,
  arc: 120,
  easing: "easeOutCubic"
};

const E = {
  easeOutCubic: t => 1 - Math.pow(1-t, 3),
  easeOutBack: t => { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
};

// Build title (static)
const titleG = document.getElementById("title-text");
DATA.title_paths.forEach(d => {
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d", d); p.setAttribute("fill","black");
  titleG.appendChild(p);
});

function getBBox(d){
  const nums = d.match(/-?\d+\.?\d*/g).map(Number);
  const xs = nums.filter((_,i)=>i%2===0), ys = nums.filter((_,i)=>i%2===1);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  return {cx:(minX+maxX)/2, cy:(minY+maxY)/2};
}
const POSES = {
  initial:  { d: DATA.pieces.victim_initial,  bb: getBBox(DATA.pieces.victim_initial) },
  impact:   { d: DATA.pieces.victim_impact,   bb: getBBox(DATA.pieces.victim_impact) },
  flying1:  { d: DATA.pieces.victim_flying1,  bb: getBBox(DATA.pieces.victim_flying1) },
  flying2:  { d: DATA.pieces.victim_flying2,  bb: getBBox(DATA.pieces.victim_flying2) },
  winner:   { d: DATA.pieces.winner,          bb: getBBox(DATA.pieces.winner) }
};
const victimEl = document.getElementById("victim-group");
const victimShape = document.getElementById("victim-shape");
const winnerEl = document.getElementById("winner-group");
const winnerShape = document.getElementById("winner-shape");
winnerShape.setAttribute("d", POSES.winner.d);

function setVictimPose(poseName){
  if(victimShape.dataset.pose !== poseName){
    victimShape.setAttribute("d", POSES[poseName].d);
    victimShape.dataset.pose = poseName;
    victimShape.dataset.cx = POSES[poseName].bb.cx;
    victimShape.dataset.cy = POSES[poseName].bb.cy;
  }
}
function tVic(tx,ty,rot,sx,sy){
  const cx = +victimShape.dataset.cx || POSES.initial.bb.cx;
  const cy = +victimShape.dataset.cy || POSES.initial.bb.cy;
  victimEl.setAttribute("transform",
    `translate(${tx} ${ty}) rotate(${rot} ${cx} ${cy}) translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})`);
}
function tWin(tx,ty,rot,sx,sy,op){
  const cx = POSES.winner.bb.cx, cy = POSES.winner.bb.cy;
  winnerEl.setAttribute("transform",
    `translate(${tx} ${ty}) rotate(${rot} ${cx} ${cy}) translate(${cx} ${cy}) scale(${sx} ${sy}) translate(${-cx} ${-cy})`);
  winnerEl.style.opacity = op;
}

function frame(progress){
  const s = CONFIG;
  const t_antic_end = s.antic;
  const t_impact = t_antic_end + 0.05;
  const t_hold_end = t_impact + (s.hold / s.duration);
  const t_mid = t_hold_end + (1 - t_hold_end) * 0.45;
  const t_out = t_hold_end + (1 - t_hold_end) * 0.85;

  // VICTIM
  let vx=0,vy=0,vrot=0,vsx=1,vsy=1;
  if(progress <= t_impact){
    setVictimPose("initial");
    const idle = Math.sin(progress*30)*0.005;
    vsx=1+idle; vsy=1-idle;
  } else if(progress <= t_hold_end){
    setVictimPose("impact");
    const k=(progress-t_impact)/Math.max(0.001,t_hold_end-t_impact);
    const sq=Math.sin(k*Math.PI)*s.squash;
    vsx=1+sq; vsy=1-sq*0.7; vx=sq*20;
  } else if(progress <= t_mid){
    setVictimPose("flying1");
    const k=(progress-t_hold_end)/(t_mid-t_hold_end);
    const eased=E[s.easing](k);
    vx=500*eased;
    vy=-s.arc*Math.sin(eased*Math.PI)*0.8;
    vrot=s.spin*360*eased*0.4;
  } else if(progress <= t_out){
    setVictimPose("flying2");
    const k=(progress-t_mid)/(t_out-t_mid);
    const eased=E[s.easing](k);
    vx=500+450*eased;
    vy=-s.arc*Math.sin((0.5+k*0.5)*Math.PI)*0.6;
    vrot=s.spin*360*(0.4+0.6*eased);
  } else {
    setVictimPose("flying2");
    const k=(progress-t_out)/(1-t_out);
    vx=950+400*k;
    vy=-s.arc*0.3+200*k*k;
    vrot=s.spin*360*(1+k*0.5);
  }
  tVic(vx,vy,vrot,vsx,vsy);

  // WINNER
  let wx=0,wy=0,wsx=1,wsy=1,wop=0;
  if(progress < t_antic_end*0.4){ wop=0; wx=-120; }
  else if(progress < t_antic_end){
    const k=(progress-t_antic_end*0.4)/(t_antic_end*0.6);
    const eased=E.easeOutCubic(k);
    wop=eased; wx=-120+120*eased;
  } else if(progress < t_impact){
    const k=(progress-t_antic_end)/(t_impact-t_antic_end);
    wop=1; wsy=1-s.squash*0.4*k; wsx=1+s.squash*0.3*k; wx=-5*k;
  } else if(progress < t_hold_end){
    const k=(progress-t_impact)/Math.max(0.001,t_hold_end-t_impact);
    wop=1;
    wsy=1-s.squash*0.4+s.squash*0.6*k;
    wsx=1+s.squash*0.3-s.squash*0.4*k;
    wx=-5+10*k;
  } else {
    const k=(progress-t_hold_end)/(1-t_hold_end);
    wop=1;
    const settle=E.easeOutBack(Math.min(1,k*3));
    wsy=(1-s.squash*0.4+s.squash*0.6)*(1-settle)+1*settle;
    wsx=(1+s.squash*0.3-s.squash*0.4)*(1-settle)+1*settle;
    wx=10*(1-settle);
    wy=-Math.sin(k*Math.PI*4)*2*Math.max(0,1-k*1.5);
  }
  tWin(wx,wy,0,wsx,wsy,wop);
}

// LOOP
let t0 = performance.now();
function tick(now){
  const elapsed = now - t0;
  const total = CONFIG.duration + CONFIG.holdAtEnd;
  if(elapsed >= total){
    t0 = now;
    frame(0);
  } else if(elapsed >= CONFIG.duration){
    frame(1);  // hold on final frame
  } else {
    frame(elapsed / CONFIG.duration);
  }
  requestAnimationFrame(tick);
}
frame(0);
requestAnimationFrame(tick);
</script>
